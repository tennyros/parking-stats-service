spring:
  application:
    name: parking-stats-service-test
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://${DB_HOST_ACT}:${DB_EPORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

parking:
  batch:
    size: 100