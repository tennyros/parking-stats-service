spring:
  application:
    name: parking-management-service-test
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:${DB_BASE:postgresql}://${DB_SERVER:localhost}:${DB_PORT:5433}/${DB_NAME:parking_management_service_app}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
  liquibase:
    enabled: false

parking:
  batch:
    size: 100